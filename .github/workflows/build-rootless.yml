
name: Build AppSync Unified (Rootless)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Rootless package
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"

          xcodebuild -version

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build AppSync Unified
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean \
            THEOS="$THEOS" \
            THEOS_PACKAGE_SCHEME=rootless \
            TARGET=iphone:clang:latest:15.0 \
            ARCHS="arm64 arm64e"

          make package \
            THEOS="$THEOS" \
            THEOS_PACKAGE_SCHEME=rootless \
            TARGET=iphone:clang:latest:15.0 \
            ARCHS="arm64 arm64e" \
            FINALPACKAGE=1 \
            STRIP=0

      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail

          packages=(debs/*.deb)

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb package."
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          echo "Package ready: ${packages[0]}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AppSync-Unified-118-Rootless
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 14
